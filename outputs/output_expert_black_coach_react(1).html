<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bluerun Analysis</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <style>
    :root {
      color-scheme: light;
      --bg: #eef3f6;
      --panel: #ffffff;
      --text: #202830;
      --muted: #7a838d;
      --line: #d7dee4;
      --blue: #2799d6;
      --needs: #d6604a;
      --developing: #f49d2a;
      --strong: #4faf79;
      --excellent: #282828;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #111;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
    }
    .shell {
      width: min(1480px, 100vw);
      background: var(--bg);
      display: grid;
      grid-template-columns: minmax(0, 1fr) 420px;
      box-shadow: 0 24px 80px rgba(0, 0, 0, .35);
    }
    video {
      width: 100%;
      height: 100%;
      display: block;
      background: #000;
      object-fit: contain;
    }
    aside {
      min-height: 100%;
      padding: 24px;
      border-left: 1px solid var(--line);
    }
    .brand {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 22px;
    }
    .logo {
      font-size: 34px;
      font-weight: 800;
      letter-spacing: 0;
      color: #8ecae2;
    }
    .badge {
      padding: 7px 12px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .08em;
      color: #aab0cc;
      background: #1e1e2e;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 16px;
    }
    .eyebrow {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .14em;
      text-transform: uppercase;
      margin-bottom: 14px;
    }
    .hero-score {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px;
      border-radius: 16px;
      background: linear-gradient(135deg, #f8fbfd, #edf4f8);
      margin-bottom: 18px;
    }
    .hero-score b {
      display: block;
      color: var(--blue);
      font-size: 18px;
      margin-bottom: 4px;
    }
    .hero-score span {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }
    .score-number {
      font-size: 48px;
      line-height: 1;
      font-weight: 900;
      color: var(--score-color);
    }
    .metric {
      margin-top: 16px;
    }
    .metric-top {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
    }
    .metric-name {
      font-size: 15px;
      font-weight: 800;
    }
    .metric-value {
      font-size: 15px;
      font-weight: 900;
      color: var(--metric-color);
    }
    .bar {
      height: 12px;
      overflow: hidden;
      border-radius: 999px;
      background: #e5ebef;
      position: relative;
    }
    .fill {
      width: var(--pct);
      height: 100%;
      border-radius: 999px;
      background: var(--metric-color);
    }
    .tier {
      margin-top: 6px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
    }
    .tiers {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
      margin-bottom: 12px;
    }
    .tiers div {
      color: white;
      border-radius: 7px;
      padding: 7px 6px;
      font-size: 10px;
      font-weight: 900;
      text-align: center;
    }
    .rows {
      display: grid;
      gap: 12px;
    }
    .row {
      display: flex;
      justify-content: space-between;
      gap: 24px;
      font-size: 14px;
      font-weight: 750;
    }
    .row span:last-child {
      color: var(--blue);
      font-weight: 900;
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    const data = {"pressure_score": 202.93888413295122, "balance_score": 202.52148772320572, "rotation_score": 211.36575412034549, "edging_score": 214.7289699133642, "output_path": "D:\\upwork\\Skiing-Analysis\\outputs\\output_expert_black_coach_react(1).mp4", "duration": 40.733333333333334, "turns": 22, "processed_frames": 408, "display_mode": "coach", "overlay_renderer": "react", "video_src": "output_expert_black_coach_react(1).mp4", "blue_iq": 207.88877397246665, "level_label": "Expert - Level 8"};
    const e = React.createElement;
    const tierColor = score => score < 100 ? "var(--needs)" : score < 150 ? "var(--developing)" : score < 200 ? "var(--strong)" : "var(--excellent)";
    const tierLabel = score => score < 100 ? "Needs Work" : score < 150 ? "Developing" : score < 200 ? "Strong" : "Excellent";
    const pct = score => Math.max(0, Math.min(100, ((score - 60) / 180) * 100)) + "%";
    function Metric({ name, score }) {
      const color = tierColor(score);
      return e("div", { className: "metric", style: { "--metric-color": color } },
        e("div", { className: "metric-top" },
          e("div", { className: "metric-name" }, name),
          e("div", { className: "metric-value" }, Math.round(score))
        ),
        e("div", { className: "bar" }, e("div", { className: "fill", style: { "--pct": pct(score) } })),
        e("div", { className: "tier" }, tierLabel(score))
      );
    }
    function App() {
      const coach = data.display_mode === "coach";
      const rows = coach
        ? [["Turns", data.turns], ["Duration", data.duration.toFixed(1) + " sec"], ["Processed frames", data.processed_frames]]
        : [["Turns completed", data.turns], ["Duration", data.duration.toFixed(1) + " sec"]];
      return e("main", { className: "shell" },
        e("video", { src: data.video_src, controls: true, autoPlay: false }),
        e("aside", null,
          e("div", { className: "brand" }, e("div", { className: "logo" }, "bluerun"), e("div", { className: "badge" }, data.display_mode.toUpperCase())),
          e("section", { className: "card" },
            e("div", { className: "eyebrow" }, "Performance Profile"),
            e("div", { className: "hero-score", style: { "--score-color": tierColor(data.blue_iq) } },
              e("div", null, e("b", null, "BLUE IQ"), e("span", null, data.level_label)),
              e("div", { className: "score-number" }, Math.round(data.blue_iq))
            ),
            e("div", { className: "tiers" },
              e("div", { style: { background: "var(--needs)" } }, "NEEDS WORK"),
              e("div", { style: { background: "var(--developing)" } }, "DEVELOPING"),
              e("div", { style: { background: "var(--strong)" } }, "STRONG"),
              e("div", { style: { background: "var(--excellent)" } }, "EXCELLENT")
            ),
            e(Metric, { name: "Pressure", score: data.pressure_score }),
            e(Metric, { name: "Balance", score: data.balance_score }),
            e(Metric, { name: "Rotation", score: data.rotation_score }),
            e(Metric, { name: "Edging", score: data.edging_score })
          ),
          e("section", { className: "card" },
            e("div", { className: "eyebrow" }, coach ? "Live Run Metrics" : "This Run"),
            e("div", { className: "rows" }, rows.map(row => e("div", { className: "row", key: row[0] }, e("span", null, row[0]), e("span", null, row[1]))))
          )
        )
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(e(App));
  </script>
</body>
</html>
